name: Atualizar Token da Lista IPTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: pip install requests

    - name: Executar script de atualizacao
      run: python atualizar_lista.py

    - name: Salvar alteracoes no GitHub
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add lista.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Lista IPTV atualizada automaticamente" && git push)
